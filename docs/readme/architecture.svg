<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#374151"/>
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0,10 3.5,0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- 브라우저 -->
  <rect x="20" y="95" width="150" height="110" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" rx="6"/>
  <text x="95" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">브라우저</text>
  <text x="95" y="165" text-anchor="middle" font-size="12" fill="#6B7280">화면 (HTML/JS)</text>

  <!-- 서버 -->
  <rect x="250" y="55" width="210" height="190" fill="#FFFFFF" stroke="#374151" stroke-width="2" rx="6"/>
  <text x="355" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">FastAPI 서버</text>
  <text x="355" y="120" text-anchor="middle" font-size="12" fill="#6B7280">로그인 · 분석 기록</text>
  <text x="355" y="143" text-anchor="middle" font-size="12" fill="#6B7280">영상 업로드 · 코트 보정</text>
  <text x="355" y="166" text-anchor="middle" font-size="12" fill="#6B7280">대회 일정 자동 수집</text>
  <text x="355" y="189" text-anchor="middle" font-size="12" fill="#6B7280">(KATO · KTA)</text>

  <!-- 오른쪽 3개 -->
  <rect x="540" y="15" width="200" height="75" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" rx="6"/>
  <text x="640" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">영상 분석</text>
  <text x="640" y="62" text-anchor="middle" font-size="11" fill="#6B7280">선수 추적 (YOLO26n · BoT-SORT)</text>
  <text x="640" y="78" text-anchor="middle" font-size="11" fill="#6B7280">+ 공 궤적 (실험 기능)</text>

  <rect x="540" y="112" width="200" height="75" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" rx="6"/>
  <text x="640" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">SQLite DB</text>
  <text x="640" y="159" text-anchor="middle" font-size="11" fill="#6B7280">회원 · 분석 기록 · 대회 일정</text>

  <rect x="540" y="209" width="200" height="75" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" rx="6"/>
  <text x="640" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">파일 폴더</text>
  <text x="640" y="256" text-anchor="middle" font-size="11" fill="#6B7280">업로드 영상 · 결과 그림</text>

  <!-- 화살표 -->
  <line x1="170" y1="150" x2="249" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arrl)"/>
  <path d="M 461 100 L 500 100 L 500 52 L 539 52" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <line x1="461" y1="150" x2="539" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arrl)"/>
  <path d="M 461 200 L 500 200 L 500 246 L 539 246" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)" marker-start="url(#arrl)"/>
</svg>
